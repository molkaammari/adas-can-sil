[pytest]
# Répertoires où chercher les tests
testpaths = tests

# Motifs des fichiers de test
python_files = test_*.py

# Motifs des classes et fonctions de test
python_classes = Test*
python_functions = test_*

# Options par défaut
# -v : verbeux
# --tb=short : traceback court en cas d'échec
# --strict-markers : erreur si un marker inconnu est utilisé
# -p no:cacheprovider : désactive le cache (évite conflits ROS)
addopts = -v --tb=short --strict-markers -p no:cacheprovider

# Marqueurs personnalisés
markers =
    dbc: tests liés au contrat DBC
    encode: tests d'encodage (données -> bytes)
    decode: tests de décodage (bytes -> données)
    roundtrip: tests aller-retour (encode -> decode)
    boundary: tests de cas limites (min/max)
    structure: tests de structure DBC (messages, signaux)
